    <!-- Instant Theme Synchronization: Dark mode is default across all users, browsers & system settings -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('aura_theme_manual');
          // Dark mode is default for all users, browsers, and system settings unless explicitly opted into light
          var isLight = saved === 'light';
          var root = document.documentElement;
          if (isLight) {
            root.classList.add('theme-light');
            root.classList.remove('theme-dark', 'dark');
            root.style.colorScheme = 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f6f8f7');
          } else {
            root.classList.add('dark', 'theme-dark');
            root.classList.remove('theme-light');
            root.style.colorScheme = 'dark';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#081321');
          }
        } catch(e) {}
      })();
    </script>
